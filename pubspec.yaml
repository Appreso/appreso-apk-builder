name: appreso_app
description: AppReso - WordPress site as a native Android app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  http: ^1.1.0
  connectivity_plus: ^5.0.0
  shared_preferences: ^2.2.0
  flutter_native_splash: ^2.3.0
  url_launcher: ^6.2.0
  onesignal_flutter: ^5.1.0
  package_info_plus: ^8.0.0
  app_links: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/
