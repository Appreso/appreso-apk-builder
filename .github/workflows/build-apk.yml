name: Build APK

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL'
        required: true
        default: 'https://example.com'
      app_name:
        description: 'App Name'
        required: true
        default: 'AppReso App'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Create Pristine Flutter Project
        run: |
          flutter create --project-name appreso_app --org com.appreso --platforms android /tmp/appreso_build
          
          # Copy custom code into the fresh project
          cp -r lib /tmp/appreso_build/
          cp -r assets /tmp/appreso_build/ 2>/dev/null || true
          cp pubspec.yaml /tmp/appreso_build/

      - name: Process Configuration Payload
        id: config
        env:
          PAYLOAD_JSON: ${{ github.event.client_payload.config_json }}
          INPUT_SITE: ${{ github.event.inputs.site_url }}
          INPUT_NAME: ${{ github.event.inputs.app_name }}
        run: |
          cd /tmp/appreso_build
          
          if [ -z "$PAYLOAD_JSON" ]; then
            echo "{\"site_url\":\"$INPUT_SITE\",\"app_name\":\"$INPUT_NAME\"}" > payload.json
          else
            echo "$PAYLOAD_JSON" > payload.json
          fi
          
          mkdir -p assets
          jq '. + {"api_namespace": "appreso/v1"}' payload.json > assets/config.json
          
          echo "APP_NAME=$(jq -r '.app_name // "AppReso App"' payload.json)" >> $GITHUB_ENV
          echo "SITE_URL=$(jq -r '.site_url // "https://example.com"' payload.json)" >> $GITHUB_ENV
          echo "APP_ICON_URL=$(jq -r '.app_icon_url // empty' payload.json)" >> $GITHUB_ENV
          echo "SPLASH_SCREEN_URL=$(jq -r '.splash_screen_url // empty' payload.json)" >> $GITHUB_ENV
          echo "DEEP_LINK_URL=$(jq -r '.deep_link_url // empty' payload.json)" >> $GITHUB_ENV
          echo "CALLBACK_URL=$(jq -r '.callback_url // empty' payload.json)" >> $GITHUB_ENV
          echo "CALLBACK_SECRET=$(jq -r '.callback_secret // empty' payload.json)" >> $GITHUB_ENV

      - name: Patch Android Build Configuration
        run: |
          cd /tmp/appreso_build
          
          echo "=== BEFORE PATCHING ==="
          echo "--- settings.gradle ---"
          cat android/settings.gradle
          echo ""
          echo "--- app/build.gradle (minSdkVersion lines) ---"
          grep -n "minSdkVersion" android/app/build.gradle || true
          echo "========================"
          
          # 1. Update minSdkVersion to 21 (required by flutter_inappwebview)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle 2>/dev/null || true
          
          # 2. Update Gradle Wrapper to 8.3
          sed -i 's/gradle-[0-9.]*-/gradle-8.3-/g' android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          
          # 3. Update AGP version to 7.4.2 (Kotlin 2.2.0 requires AGP >= 7.3.1, default 7.3.0)
          sed -i 's/id "com.android.application" version "7.3.0" apply false/id "com.android.application" version "7.4.2" apply false/g' android/settings.gradle 2>/dev/null || true
          sed -i 's/id "com.android.application" version "[^"]*" apply false/id "com.android.application" version "7.4.2" apply false/g' android/settings.gradle 2>/dev/null || true
          
          # 4. Update Kotlin version to 2.2.0
          sed -i 's/id "org.jetbrains.kotlin.android" version "1.7.10" apply false/id "org.jetbrains.kotlin.android" version "2.2.0" apply false/g' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "1.8.22" apply false/id "org.jetbrains.kotlin.android" version "2.2.0" apply false/g' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "1.9.0" apply false/id "org.jetbrains.kotlin.android" version "2.2.0" apply false/g' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "1.9.24" apply false/id "org.jetbrains.kotlin.android" version "2.2.0" apply false/g' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "2.0.20" apply false/id "org.jetbrains.kotlin.android" version "2.2.0" apply false/g' android/settings.gradle
          
          # 5. Fix JVM Target Compatibility (Align Java & Kotlin to Java 17)
          printf "\nandroid {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = '17'\n    }\n}\n" >> android/app/build.gradle
          
          echo ""
          echo "=== AFTER PATCHING ==="
          echo "--- settings.gradle ---"
          cat android/settings.gradle
          echo ""
          echo "--- app/build.gradle (minSdkVersion lines) ---"
          grep -n "minSdk" android/app/build.gradle || true
          echo "========================"

      - name: Download and set App Icon
        run: |
          cd /tmp/appreso_build
          
          if [ -n "$APP_ICON_URL" ] && [ "$APP_ICON_URL" != "" ]; then
            echo "Downloading app icon from: $APP_ICON_URL"
            curl -L -o assets/app_icon.png "$APP_ICON_URL"
            
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            
            ICON_DIRS=(
              "android/app/src/main/res/mipmap-mdpi:48"
              "android/app/src/main/res/mipmap-hdpi:72"
              "android/app/src/main/res/mipmap-xhdpi:96"
              "android/app/src/main/res/mipmap-xxhdpi:144"
              "android/app/src/main/res/mipmap-xxxhdpi:192"
            )
            
            for entry in "${ICON_DIRS[@]}"; do
              DIR="${entry%%:*}"
              SIZE="${entry##*:}"
              mkdir -p "$DIR"
              convert assets/app_icon.png -resize ${SIZE}x${SIZE} "$DIR/ic_launcher.png"
            done
          fi

      - name: Download Splash Screen
        run: |
          cd /tmp/appreso_build
          if [ -n "$SPLASH_SCREEN_URL" ] && [ "$SPLASH_SCREEN_URL" != "" ]; then
            curl -L -o assets/splash.png "$SPLASH_SCREEN_URL"
          fi

      - name: Set App Label & Deep Linking in AndroidManifest.xml
        run: |
          cd /tmp/appreso_build
          
          # Set App Label
          sed -i "s|android:label=\"appreso_app\"|android:label=\"${APP_NAME}\"|g" android/app/src/main/AndroidManifest.xml
          
          # Internet Permission
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi
          
          # Deep Linking
          if [ -n "$DEEP_LINK_URL" ] && [ "$DEEP_LINK_URL" != "" ]; then
            SCHEME=$(echo "$DEEP_LINK_URL" | sed -E 's|^(.*)://.*|\1|')
            HOST=$(echo "$DEEP_LINK_URL" | sed -E 's|^.*://([^/]*).*|\1|')
            
            INTENT_FILTER="<intent-filter android:autoVerify=\"true\">\n<action android:name=\"android.intent.action.VIEW\" />\n<category android:name=\"android.intent.category.DEFAULT\" />\n<category android:name=\"android.intent.category.BROWSABLE\" />\n<data android:scheme=\"$SCHEME\" android:host=\"$HOST\" />\n</intent-filter>"
            
            sed -i "/<\/activity>/i $INTENT_FILTER" android/app/src/main/AndroidManifest.xml
          fi

      - name: Build Release APK
        run: |
          cd /tmp/appreso_build
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          mkdir -p $GITHUB_WORKSPACE/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/build/app/outputs/flutter-apk/

      - name: Create Release & Upload APK
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "APK Build #${{ github.run_number }} - ${{ env.APP_NAME }}"
          body: |
            **App Name:** ${{ env.APP_NAME }}
            **Site URL:** ${{ env.SITE_URL }}
            **Built at:** ${{ github.event.repository.updated_at }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send callback to WordPress
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/app-release.apk"
          
          if [ -n "$CALLBACK_URL" ] && [ "$CALLBACK_URL" != "" ]; then
            curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-AppReso-Secret: $CALLBACK_SECRET" \
              -d "{\"apk_url\": \"${APK_URL}\", \"status\": \"success\"}"
          fi

      - name: Send failure callback
        if: failure()
        run: |
          if [ -f /tmp/appreso_build/payload.json ]; then
            CALLBACK_URL=$(jq -r '.callback_url // empty' /tmp/appreso_build/payload.json)
            CALLBACK_SECRET=$(jq -r '.callback_secret // empty' /tmp/appreso_build/payload.json)
            
            if [ -n "$CALLBACK_URL" ] && [ "$CALLBACK_URL" != "" ]; then
              curl -s -X POST "$CALLBACK_URL" \
                -H "Content-Type: application/json" \
                -H "X-AppReso-Secret: $CALLBACK_SECRET" \
                -d '{"status": "failed", "error": "APK build failed. Check GitHub Actions logs."}'
            fi
          fi
