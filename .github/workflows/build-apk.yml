name: Build APK

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL'
        required: true
        default: 'https://example.com'
      app_name:
        description: 'App Name'
        required: true
        default: 'AppReso App'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'
          cache: true

      - name: Create Flutter project scaffold
        run: |
          # Create a temporary Flutter project to get the Android boilerplate
          flutter create --project-name appreso_app --org com.appreso --platforms android /tmp/flutter_scaffold
          
          # Copy Android directory from scaffold to our project
          cp -r /tmp/flutter_scaffold/android ./android
          cp -r /tmp/flutter_scaffold/test ./test
          cp /tmp/flutter_scaffold/analysis_options.yaml ./analysis_options.yaml 2>/dev/null || true
          
          # Update minSdkVersion to 21 for flutter_inappwebview support
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true

      - name: Inject site configuration
        run: |
          SITE_URL="${{ github.event.client_payload.site_url || github.event.inputs.site_url }}"
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          SPLASH_TYPE="${{ github.event.client_payload.splash_type || 'color' }}"
          SPLASH_BG_COLOR="${{ github.event.client_payload.splash_bg_color || '#4f46e5' }}"
          SPLASH_SHOW_NAME="${{ github.event.client_payload.splash_show_name || 'yes' }}"
          SPLASH_CUSTOM_TEXT="${{ github.event.client_payload.splash_custom_text || '' }}"
          SPLASH_TEXT_COLOR="${{ github.event.client_payload.splash_text_color || '#ffffff' }}"
          PRELOADER_ENABLED="${{ github.event.client_payload.preloader_enabled || 'yes' }}"
          PRELOADER_STYLE="${{ github.event.client_payload.preloader_style || 'circular' }}"
          PRELOADER_COLOR="${{ github.event.client_payload.preloader_color || '#6366f1' }}"
          PRELOADER_BG_COLOR="${{ github.event.client_payload.preloader_bg_color || '#ffffff' }}"
          PULL_REFRESH="${{ github.event.client_payload.pull_refresh || 'yes' }}"
          PULL_REFRESH_COLOR="${{ github.event.client_payload.pull_refresh_color || '#6366f1' }}"
          STATUS_BAR_COLOR="${{ github.event.client_payload.status_bar_color || '#6366f1' }}"
          SHOW_BRANDING="${{ github.event.client_payload.show_branding || 'yes' }}"
          
          # Phase 1 Features
          OFFLINE_MODE="${{ github.event.client_payload.offline_mode || 'yes' }}"
          APP_VERSION="${{ github.event.client_payload.app_version || '1.0.0' }}"
          UPDATE_MESSAGE="${{ github.event.client_payload.update_message || 'A new version of the app is available. Please update to continue.' }}"
          ONESIGNAL_APP_ID="${{ github.event.client_payload.onesignal_app_id || '' }}"
          DEEP_LINK_URL="${{ github.event.client_payload.deep_link_url || '' }}"
          BOTTOM_NAV_ENABLED="${{ github.event.client_payload.bottom_nav_enabled || 'no' }}"
          BOTTOM_NAV_TABS="${{ github.event.client_payload.bottom_nav_tabs || '[]' }}"
          BOTTOM_NAV_BG_COLOR="${{ github.event.client_payload.bottom_nav_bg_color || '#ffffff' }}"
          BOTTOM_NAV_ACTIVE_COLOR="${{ github.event.client_payload.bottom_nav_active_color || '#6366f1' }}"
          BOTTOM_NAV_INACTIVE_COLOR="${{ github.event.client_payload.bottom_nav_inactive_color || '#94a3b8' }}"
          BOTTOM_NAV_STYLE="${{ github.event.client_payload.bottom_nav_style || 'full' }}"
          
          # Ensure tabs is valid JSON or fallback to empty array
          if ! echo "$BOTTOM_NAV_TABS" | jq . >/dev/null 2>&1; then
            BOTTOM_NAV_TABS="[]"
          fi
          
          mkdir -p assets
          cat > assets/config.json << EOF
          {
            "site_url": "${SITE_URL}",
            "app_name": "${APP_NAME}",
            "api_namespace": "appreso/v1",
            "splash_type": "${SPLASH_TYPE}",
            "splash_bg_color": "${SPLASH_BG_COLOR}",
            "splash_show_name": "${SPLASH_SHOW_NAME}",
            "splash_custom_text": "${SPLASH_CUSTOM_TEXT}",
            "splash_text_color": "${SPLASH_TEXT_COLOR}",
            "preloader_enabled": "${PRELOADER_ENABLED}",
            "preloader_style": "${PRELOADER_STYLE}",
            "preloader_color": "${PRELOADER_COLOR}",
            "preloader_bg_color": "${PRELOADER_BG_COLOR}",
            "pull_refresh": "${PULL_REFRESH}",
            "pull_refresh_color": "${PULL_REFRESH_COLOR}",
            "status_bar_color": "${STATUS_BAR_COLOR}",
            "show_branding": "${SHOW_BRANDING}",
            "offline_mode": "${OFFLINE_MODE}",
            "app_version": "${APP_VERSION}",
            "update_message": "${UPDATE_MESSAGE}",
            "onesignal_app_id": "${ONESIGNAL_APP_ID}",
            "deep_link_url": "${DEEP_LINK_URL}",
            "bottom_nav_enabled": "${BOTTOM_NAV_ENABLED}",
            "bottom_nav_tabs": ${BOTTOM_NAV_TABS},
            "bottom_nav_bg_color": "${BOTTOM_NAV_BG_COLOR}",
            "bottom_nav_active_color": "${BOTTOM_NAV_ACTIVE_COLOR}",
            "bottom_nav_inactive_color": "${BOTTOM_NAV_INACTIVE_COLOR}",
            "bottom_nav_style": "${BOTTOM_NAV_STYLE}"
          }
          EOF
          
          echo "Site URL: ${SITE_URL}"
          echo "App Name: ${APP_NAME}"

      - name: Download and set App Icon
        run: |
          ICON_URL="${{ github.event.client_payload.app_icon_url || '' }}"
          
          if [ -n "$ICON_URL" ] && [ "$ICON_URL" != "" ]; then
            echo "Downloading app icon from: $ICON_URL"
            mkdir -p assets
            curl -L -o assets/app_icon.png "$ICON_URL"
            
            # Install ImageMagick for icon resizing
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            
            # Generate Android launcher icons at various densities
            ICON_DIRS=(
              "android/app/src/main/res/mipmap-mdpi:48"
              "android/app/src/main/res/mipmap-hdpi:72"
              "android/app/src/main/res/mipmap-xhdpi:96"
              "android/app/src/main/res/mipmap-xxhdpi:144"
              "android/app/src/main/res/mipmap-xxxhdpi:192"
            )
            
            for entry in "${ICON_DIRS[@]}"; do
              DIR="${entry%%:*}"
              SIZE="${entry##*:}"
              mkdir -p "$DIR"
              convert assets/app_icon.png -resize ${SIZE}x${SIZE} "$DIR/ic_launcher.png"
              echo "Generated ${SIZE}x${SIZE} icon in $DIR"
            done
          else
            echo "No app icon URL provided, using default Flutter icon"
          fi

      - name: Download Splash Screen
        run: |
          SPLASH_URL="${{ github.event.client_payload.splash_screen_url || '' }}"
          
          if [ -n "$SPLASH_URL" ] && [ "$SPLASH_URL" != "" ]; then
            echo "Downloading splash screen from: $SPLASH_URL"
            mkdir -p assets
            curl -L -o assets/splash.png "$SPLASH_URL"
            echo "Splash screen saved"
          fi

      - name: Set App Label in AndroidManifest.xml
        run: |
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          
          # Update the app label in AndroidManifest.xml
          sed -i "s/android:label=\"appreso_app\"/android:label=\"${APP_NAME}\"/g" android/app/src/main/AndroidManifest.xml
          
          # Also add internet permission if not already there
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi
          
          echo "App label set to: ${APP_NAME}"

      - name: Configure Deep Linking
        run: |
          DEEP_LINK_URL="${{ github.event.client_payload.deep_link_url || '' }}"
          
          if [ -n "$DEEP_LINK_URL" ] && [ "$DEEP_LINK_URL" != "" ]; then
            echo "Configuring deep link for: $DEEP_LINK_URL"
            
            # Extract scheme and host from URL (very basic parsing)
            # e.g. https://example.com -> scheme=https, host=example.com
            # e.g. myapp://open -> scheme=myapp, host=open
            SCHEME=$(echo "$DEEP_LINK_URL" | sed -E 's|^(.*)://.*|\1|')
            HOST=$(echo "$DEEP_LINK_URL" | sed -E 's|^.*://([^/]*).*|\1|')
            
            INTENT_FILTER="<intent-filter android:autoVerify=\"true\">\n<action android:name=\"android.intent.action.VIEW\" />\n<category android:name=\"android.intent.category.DEFAULT\" />\n<category android:name=\"android.intent.category.BROWSABLE\" />\n<data android:scheme=\"$SCHEME\" android:host=\"$HOST\" />\n</intent-filter>"
            
            # Inject intent-filter before </activity>
            sed -i "/<\/activity>/i $INTENT_FILTER" android/app/src/main/AndroidManifest.xml
          else
            echo "No deep link configured"
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Create Release & Upload APK
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "APK Build #${{ github.run_number }} - ${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          body: |
            **App Name:** ${{ github.event.client_payload.app_name || github.event.inputs.app_name }}
            **Site URL:** ${{ github.event.client_payload.site_url || github.event.inputs.site_url }}
            **Built at:** ${{ github.event.repository.updated_at }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send callback to WordPress
        run: |
          CALLBACK_URL="${{ github.event.client_payload.callback_url || '' }}"
          CALLBACK_SECRET="${{ github.event.client_payload.callback_secret || '' }}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/app-release.apk"
          
          if [ -n "$CALLBACK_URL" ] && [ "$CALLBACK_URL" != "" ]; then
            echo "Sending callback to: $CALLBACK_URL"
            
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-AppReso-Secret: $CALLBACK_SECRET" \
              -d "{\"apk_url\": \"${APK_URL}\", \"status\": \"success\"}")
            
            echo "Callback response status: $HTTP_STATUS"
          fi

      - name: Send failure callback
        if: failure() && github.event.client_payload.callback_url != ''
        run: |
          CALLBACK_URL="${{ github.event.client_payload.callback_url }}"
          CALLBACK_SECRET="${{ github.event.client_payload.callback_secret }}"
          
          curl -s -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-AppReso-Secret: $CALLBACK_SECRET" \
            -d '{"status": "failed", "error": "APK build failed. Check GitHub Actions logs."}'
