name: Build APK

on:
  repository_dispatch:
    types: [build-apk, build_apk]
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL'
        required: true
        default: 'https://example.com'
      app_name:
        description: 'App Name'
        required: true
        default: 'AppReso App'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.22.3'
          cache: true

      - name: Create Pristine Flutter Project
        run: |
          flutter create --project-name appreso_app --org com.appreso --platforms android /tmp/appreso_build
          cp -r lib /tmp/appreso_build/
          cp -r assets /tmp/appreso_build/ 2>/dev/null || true
          cp pubspec.yaml /tmp/appreso_build/

      - name: Process Configuration Payload
        id: config
        env:
          EVENT_PAYLOAD: ${{ toJson(github.event) }}
        run: |
          cd /tmp/appreso_build
          mkdir -p assets

          cat > /tmp/parse_payload.py << 'PYTHON_SCRIPT'
          import json, os, sys, re

          raw = os.environ.get("EVENT_PAYLOAD", "{}")
          try:
              event = json.loads(raw)
          except Exception as e:
              print(f"Error parsing event JSON: {e}")
              event = {}

          client_payload = event.get("client_payload", {})
          inputs = event.get("inputs", {})

          cfg = {}
          if isinstance(client_payload, dict) and "config_json" in client_payload:
              cfg_val = client_payload["config_json"]
              if isinstance(cfg_val, str):
                  try:
                      cfg = json.loads(cfg_val)
                  except Exception as e:
                      print(f"Error parsing config_json: {e}")
                      cfg = {}
              elif isinstance(cfg_val, dict):
                  cfg = cfg_val
          elif isinstance(client_payload, dict) and client_payload:
              cfg = client_payload
          else:
              cfg = {
                  "site_url": inputs.get("site_url", "https://example.com"),
                  "app_name": inputs.get("app_name", "AppReso App"),
              }

          cfg["api_namespace"] = "appreso/v1"

          with open("assets/config.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)

          # Patch pubspec.yaml version to match WordPress app_version
          app_ver = cfg.get("app_version", "1.0.0").strip()
          if os.path.exists("pubspec.yaml"):
              with open("pubspec.yaml", "r", encoding="utf-8") as pf:
                  pcontent = pf.read()
              pcontent = re.sub(r"version:\s*.*", f"version: {app_ver}+1", pcontent)
              with open("pubspec.yaml", "w", encoding="utf-8") as pf:
                  pf.write(pcontent)
              print(f"Patched pubspec.yaml version to: {app_ver}+1")

          env_path = os.environ.get("GITHUB_ENV", "")
          if env_path and os.path.exists(env_path):
              with open(env_path, "a", encoding="utf-8") as f:
                  f.write("APP_NAME=" + cfg.get("app_name", "AppReso App") + "\n")
                  f.write("APP_VERSION=" + app_ver + "\n")
                  f.write("SITE_URL=" + cfg.get("site_url", "https://example.com") + "\n")
                  f.write("APP_ICON_URL=" + cfg.get("app_icon_url", "") + "\n")
                  f.write("SPLASH_SCREEN_URL=" + cfg.get("splash_screen_url", "") + "\n")
                  f.write("DEEP_LINK_URL=" + cfg.get("deep_link_url", "") + "\n")
                  f.write("CALLBACK_URL=" + cfg.get("callback_url", "") + "\n")
                  f.write("CALLBACK_SECRET=" + cfg.get("callback_secret", "") + "\n")
                  f.write("BUILD_ID=" + cfg.get("build_id", "") + "\n")

          print("Configuration parsed successfully:")
          print(json.dumps(cfg, indent=2, ensure_ascii=False))
          PYTHON_SCRIPT

          python3 /tmp/parse_payload.py

      - name: Patch Android Build Configuration
        run: |
          cd /tmp/appreso_build

          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true

          sed -i 's/gradle-[0-9.]*-/gradle-8.3-/g' android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true

          sed -i 's/id "com.android.application" version "[^"]*" apply false/id "com.android.application" version "7.4.2" apply false/g' android/settings.gradle 2>/dev/null || true

          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*" apply false/id "org.jetbrains.kotlin.android" version "2.2.0" apply false/g' android/settings.gradle 2>/dev/null || true

          printf "\nandroid {\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = '17'\n    }\n}\n" >> android/app/build.gradle

      - name: Download and Process App Icon & Splash Screen
        run: |
          cd /tmp/appreso_build
          python3 -m pip install --quiet pillow

          cat > /tmp/process_images.py << 'PYTHON_IMG'
          import os
          from PIL import Image

          icon_url = os.environ.get("APP_ICON_URL", "").strip()
          splash_url = os.environ.get("SPLASH_SCREEN_URL", "").strip()

          if icon_url:
              print(f"Downloading app icon: {icon_url}")
              os.system(f'curl -sSL -o assets/app_icon_raw "{icon_url}"')
              try:
                  with Image.open("assets/app_icon_raw") as img:
                      img = img.convert("RGBA")
                      img.save("assets/app_icon.png", "PNG")
                      icon_dirs = {
                          "android/app/src/main/res/mipmap-mdpi/ic_launcher.png": (48, 48),
                          "android/app/src/main/res/mipmap-hdpi/ic_launcher.png": (72, 72),
                          "android/app/src/main/res/mipmap-xhdpi/ic_launcher.png": (96, 96),
                          "android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png": (144, 144),
                          "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png": (192, 192),
                      }
                      for path, size in icon_dirs.items():
                          os.makedirs(os.path.dirname(path), exist_ok=True)
                          resized = img.resize(size, Image.Resampling.LANCZOS)
                          resized.save(path, "PNG", optimize=True)
                  print("App icons generated successfully.")
              except Exception as e:
                  print(f"Error processing app icon: {e}")

          if splash_url:
              print(f"Downloading splash screen: {splash_url}")
              os.system(f'curl -sSL -o assets/splash_raw "{splash_url}"')
              try:
                  with Image.open("assets/splash_raw") as img:
                      img = img.convert("RGBA")
                      img.save("assets/splash.png", "PNG")
                  print("Splash screen ready.")
              except Exception as e:
                  print(f"Error processing splash image: {e}")
          PYTHON_IMG

          python3 /tmp/process_images.py

      - name: Set App Label and AndroidManifest
        run: |
          cd /tmp/appreso_build

          sed -i "s|android:label=\"appreso_app\"|android:label=\"${APP_NAME}\"|g" android/app/src/main/AndroidManifest.xml

          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi

          if ! grep -q 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          fi

          if [ -n "$DEEP_LINK_URL" ] && [ "$DEEP_LINK_URL" != "" ]; then
            SCHEME=$(echo "$DEEP_LINK_URL" | sed -E 's|^(.*)://.*|\1|')
            HOST=$(echo "$DEEP_LINK_URL" | sed -E 's|^.*://([^/]*).*|\1|')
            INTENT_FILTER="<intent-filter android:autoVerify=\"true\">\n<action android:name=\"android.intent.action.VIEW\" />\n<category android:name=\"android.intent.category.DEFAULT\" />\n<category android:name=\"android.intent.category.BROWSABLE\" />\n<data android:scheme=\"$SCHEME\" android:host=\"$HOST\" />\n</intent-filter>"
            sed -i "/<\/activity>/i $INTENT_FILTER" android/app/src/main/AndroidManifest.xml
          fi

      - name: Build Release APK
        run: |
          cd /tmp/appreso_build
          flutter clean
          flutter pub get
          flutter build apk --release --build-name="${APP_VERSION:-1.0.0}" --build-number=${{ github.run_number }} --no-tree-shake-icons

          mkdir -p $GITHUB_WORKSPACE/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/build/app/outputs/flutter-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create Release and Upload APK
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i to publish release..."
            if gh release create "build-${{ github.run_number }}" \
              build/app/outputs/flutter-apk/app-release.apk \
              --title "APK Build #${{ github.run_number }} - ${{ env.APP_NAME }} v${{ env.APP_VERSION }}" \
              --notes "**App Name:** ${{ env.APP_NAME }}
          **Version:** ${{ env.APP_VERSION }}
          **Site URL:** ${{ env.SITE_URL }}
          **Built at:** $(date -u)" ; then
              echo "Release published successfully!"
              exit 0
            fi
            echo "Retrying in 8 seconds..."
            sleep 8
          done
          echo "Failed to create release after 5 attempts."
          exit 1

      - name: Send callback to WordPress
        if: success()
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/app-release.apk"

          if [ -n "$CALLBACK_URL" ] && [ "$CALLBACK_URL" != "" ]; then
            curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-AppReso-Secret: $CALLBACK_SECRET" \
              -d "{\"apk_url\": \"${APK_URL}\", \"status\": \"success\", \"build_id\": \"${BUILD_ID}\"}"
          fi

      - name: Send failure callback
        if: failure()
        run: |
          if [ -f /tmp/appreso_build/payload.json ]; then
            FAIL_CB_URL=$(jq -r '.callback_url // empty' /tmp/appreso_build/payload.json)
            FAIL_CB_SECRET=$(jq -r '.callback_secret // empty' /tmp/appreso_build/payload.json)

            if [ -n "$FAIL_CB_URL" ] && [ "$FAIL_CB_URL" != "" ]; then
              curl -s -X POST "$FAIL_CB_URL" \
                -H "Content-Type: application/json" \
                -H "X-AppReso-Secret: $FAIL_CB_SECRET" \
                -d '{"status": "failed", "error": "APK build failed. Check GitHub Actions logs."}'
            fi
          fi
