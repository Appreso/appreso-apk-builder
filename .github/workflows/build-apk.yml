name: Build APK

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL'
        required: true
        default: 'https://example.com'
      app_name:
        description: 'App Name'
        required: true
        default: 'AppReso App'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'
          cache: true

      - name: Create Flutter project scaffold
        run: |
          # Create a temporary Flutter project to get the Android boilerplate
          flutter create --project-name appreso_app --org com.appreso --platforms android /tmp/flutter_scaffold
          
          # Copy Android directory from scaffold to our project
          cp -r /tmp/flutter_scaffold/android ./android
          cp -r /tmp/flutter_scaffold/test ./test
          cp /tmp/flutter_scaffold/analysis_options.yaml ./analysis_options.yaml 2>/dev/null || true
          
          # Update minSdkVersion to 21 for flutter_inappwebview support
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdkVersion 19/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || true

      - name: Process Configuration Payload
        id: config
        run: |
          # To bypass GitHub's 10 property limit for repository_dispatch, 
          # we pass everything inside a single JSON string called config_json
          CONFIG_JSON='${{ github.event.client_payload.config_json }}'
          
          # If triggered via workflow_dispatch manually, create a dummy JSON
          if [ -z "$CONFIG_JSON" ]; then
            CONFIG_JSON="{\"site_url\":\"${{ github.event.inputs.site_url }}\",\"app_name\":\"${{ github.event.inputs.app_name }}\"}"
          fi
          
          # Write it to a file for jq to read
          echo "$CONFIG_JSON" > payload.json
          
          # Generate the final assets/config.json for Flutter
          mkdir -p assets
          # Note: We just copy the payload as the config, ensuring api_namespace is set
          jq '. + {"api_namespace": "appreso/v1"}' payload.json > assets/config.json
          
          # Extract key variables for bash scripts
          echo "APP_NAME=$(jq -r '.app_name // "AppReso App"' payload.json)" >> $GITHUB_ENV
          echo "SITE_URL=$(jq -r '.site_url // "https://example.com"' payload.json)" >> $GITHUB_ENV
          echo "APP_ICON_URL=$(jq -r '.app_icon_url // empty' payload.json)" >> $GITHUB_ENV
          echo "SPLASH_SCREEN_URL=$(jq -r '.splash_screen_url // empty' payload.json)" >> $GITHUB_ENV
          echo "DEEP_LINK_URL=$(jq -r '.deep_link_url // empty' payload.json)" >> $GITHUB_ENV
          echo "CALLBACK_URL=$(jq -r '.callback_url // empty' payload.json)" >> $GITHUB_ENV
          echo "CALLBACK_SECRET=$(jq -r '.callback_secret // empty' payload.json)" >> $GITHUB_ENV

      - name: Download and set App Icon
        run: |
          if [ -n "$APP_ICON_URL" ] && [ "$APP_ICON_URL" != "" ]; then
            echo "Downloading app icon from: $APP_ICON_URL"
            curl -L -o assets/app_icon.png "$APP_ICON_URL"
            
            # Install ImageMagick for icon resizing
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
            
            # Generate Android launcher icons at various densities
            ICON_DIRS=(
              "android/app/src/main/res/mipmap-mdpi:48"
              "android/app/src/main/res/mipmap-hdpi:72"
              "android/app/src/main/res/mipmap-xhdpi:96"
              "android/app/src/main/res/mipmap-xxhdpi:144"
              "android/app/src/main/res/mipmap-xxxhdpi:192"
            )
            
            for entry in "${ICON_DIRS[@]}"; do
              DIR="${entry%%:*}"
              SIZE="${entry##*:}"
              mkdir -p "$DIR"
              convert assets/app_icon.png -resize ${SIZE}x${SIZE} "$DIR/ic_launcher.png"
              echo "Generated ${SIZE}x${SIZE} icon in $DIR"
            done
          else
            echo "No app icon URL provided, using default Flutter icon"
          fi

      - name: Download Splash Screen
        run: |
          if [ -n "$SPLASH_SCREEN_URL" ] && [ "$SPLASH_SCREEN_URL" != "" ]; then
            echo "Downloading splash screen from: $SPLASH_SCREEN_URL"
            curl -L -o assets/splash.png "$SPLASH_SCREEN_URL"
            echo "Splash screen saved"
          fi

      - name: Set App Label in AndroidManifest.xml
        run: |
          # Update the app label in AndroidManifest.xml
          sed -i "s/android:label=\"appreso_app\"/android:label=\"${APP_NAME}\"/g" android/app/src/main/AndroidManifest.xml
          
          # Also add internet permission if not already there
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          fi
          
          echo "App label set to: ${APP_NAME}"

      - name: Configure Deep Linking
        run: |
          if [ -n "$DEEP_LINK_URL" ] && [ "$DEEP_LINK_URL" != "" ]; then
            echo "Configuring deep link for: $DEEP_LINK_URL"
            
            # Extract scheme and host from URL (very basic parsing)
            SCHEME=$(echo "$DEEP_LINK_URL" | sed -E 's|^(.*)://.*|\1|')
            HOST=$(echo "$DEEP_LINK_URL" | sed -E 's|^.*://([^/]*).*|\1|')
            
            INTENT_FILTER="<intent-filter android:autoVerify=\"true\">\n<action android:name=\"android.intent.action.VIEW\" />\n<category android:name=\"android.intent.category.DEFAULT\" />\n<category android:name=\"android.intent.category.BROWSABLE\" />\n<data android:scheme=\"$SCHEME\" android:host=\"$HOST\" />\n</intent-filter>"
            
            # Inject intent-filter before </activity>
            sed -i "/<\/activity>/i $INTENT_FILTER" android/app/src/main/AndroidManifest.xml
          else
            echo "No deep link configured"
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Create Release & Upload APK
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "APK Build #${{ github.run_number }} - ${{ env.APP_NAME }}"
          body: |
            **App Name:** ${{ env.APP_NAME }}
            **Site URL:** ${{ env.SITE_URL }}
            **Built at:** ${{ github.event.repository.updated_at }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send callback to WordPress
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/app-release.apk"
          
          if [ -n "$CALLBACK_URL" ] && [ "$CALLBACK_URL" != "" ]; then
            echo "Sending callback to: $CALLBACK_URL"
            
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-AppReso-Secret: $CALLBACK_SECRET" \
              -d "{\"apk_url\": \"${APK_URL}\", \"status\": \"success\"}")
            
            echo "Callback response status: $HTTP_STATUS"
          fi

      - name: Send failure callback
        if: failure()
        run: |
          # Read from payload.json directly since environment variables might not be available in failure step if config step failed
          if [ -f payload.json ]; then
            CALLBACK_URL=$(jq -r '.callback_url // empty' payload.json)
            CALLBACK_SECRET=$(jq -r '.callback_secret // empty' payload.json)
            
            if [ -n "$CALLBACK_URL" ] && [ "$CALLBACK_URL" != "" ]; then
              curl -s -X POST "$CALLBACK_URL" \
                -H "Content-Type: application/json" \
                -H "X-AppReso-Secret: $CALLBACK_SECRET" \
                -d '{"status": "failed", "error": "APK build failed. Check GitHub Actions logs."}'
            fi
          fi
